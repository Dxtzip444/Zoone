; Zoone for Spicetify (after the Zune desktop software)
; ------------------------------------------------------------------
; Color schemes. Pick one with:
;   spicetify config current_theme Zoone color_scheme light
;   spicetify config current_theme Zoone color_scheme dark
;
; Spotify keys (see SpicetifyDefault/color.ini for what each one paints):
;   text, subtext, main, main-elevated, highlight, highlight-elevated,
;   sidebar, player, card, shadow, selected-row, button, button-active,
;   button-disabled, tab-active, notification, notification-error, misc
;
; Zune keys (used only by this theme):
;   zune-accent      the Zune magenta: selection, active pivots, toggles
;   zune-accent-2    the orange end of the corner stripe gradient
;   zune-pivot       inactive pivot text ("collection marketplace social")
;   zune-line        hairlines, scrollbar tracks, input borders
;   qp-*             colors for the black Quickplay (home) screen when the
;                    rest of the app is light

[light]
; Zune 4.x default: white canvas, charcoal type, magenta accent
text               = 1e1e1e
subtext            = 767676
main               = ffffff
main-elevated      = ffffff
highlight          = efefef
highlight-elevated = e6e6e6
sidebar            = ffffff
player             = ffffff
card               = f4f4f4
shadow             = 000000
selected-row       = 4a4a4a
button             = ec008c
button-active      = e3007f
button-disabled    = d6d6d6
tab-active         = e8e8e8
notification       = ec008c
notification-error = d6213b
misc               = a3a3a3
zune-accent        = ec008c
zune-accent-2      = f7941d
zune-pivot         = 949494
zune-line          = dcdcdc
qp-main            = 0b0b0b
qp-text            = ffffff
qp-subtext         = 8c8c8c
qp-pivot           = 666666
qp-highlight       = 222222
qp-line            = 2e2e2e

[dark]
; Quickplay / Now Playing black, everywhere
text               = f2f2f2
subtext            = 8c8c8c
main               = 0b0b0b
main-elevated      = 1b1b1b
highlight          = 202020
highlight-elevated = 2a2a2a
sidebar            = 0b0b0b
player             = 0b0b0b
card               = 161616
shadow             = 000000
selected-row       = d0d0d0
button             = ec008c
button-active      = ff2da0
button-disabled    = 3a3a3a
tab-active         = 2a2a2a
notification       = ec008c
notification-error = e5384f
misc               = 6b6b6b
zune-accent        = ff2da0
zune-accent-2      = f7941d
zune-pivot         = 666666
zune-line          = 2e2e2e
qp-main            = 0b0b0b
qp-text            = f2f2f2
qp-subtext         = 8c8c8c
qp-pivot           = 666666
qp-highlight       = 222222
qp-line            = 2e2e2e
